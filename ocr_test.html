<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR 화면검색 테스트 | 큐플레이 족보</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#0E1020; --surface:#181B34; --surface-2:#20244a; --line:#2c3160;
    --text:#EDEEF7; --muted:#8A90BC; --buzz:#C6F135; --hot:#FF4D97; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","맑은 고딕",sans-serif;
    padding:14px;max-width:820px;margin:0 auto;line-height:1.5}
  .top-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:17px;margin:0;flex:1 1 auto}
  button{background:var(--surface-2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
  button.primary{background:var(--buzz);color:#101010;border-color:var(--buzz)}
  button.stop{background:var(--hot);color:#fff;border-color:var(--hot)}
  button:disabled{opacity:.45;cursor:not-allowed}
  select{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  .steps{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .steps b{color:var(--buzz)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--buzz);box-shadow:0 0 8px var(--buzz);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .status{font-size:12.5px;color:var(--muted)}
  #results{min-height:100px}
  .res{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;margin-bottom:6px}
  .res.top{border-color:var(--buzz);box-shadow:0 0 0 1px var(--buzz)}
  .res-main{flex:1 1 auto;min-width:0}
  .res .q{font-size:13px;color:var(--text);line-height:1.35}
  .res .a{margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .alabel{color:var(--muted);font-size:10.5px;font-weight:700}
  .ans{color:var(--buzz);font-weight:800;font-size:18px}
  .catTag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .pct{flex:0 0 auto;font-size:21px;font-weight:800;text-align:center;min-width:54px}
  .pct small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
  .pct.hi{color:var(--buzz)} .pct.mid{color:#f0a91e} .pct.lo{color:var(--muted)}
  mark{background:rgba(198,241,53,.3);color:inherit;border-radius:3px;padding:0 1px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px}
  .macro{background:rgba(240,169,30,.14);border:2px solid #f0a91e;border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:9px}
  .macro-title{font-size:21px;font-weight:800;color:#f0a91e}
  .macro-sub{font-size:13.5px;color:var(--text);margin-top:6px}
  details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
  summary{cursor:pointer;color:var(--muted);font-size:13px}
  textarea{width:100%;margin-top:8px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;resize:vertical;min-height:46px}
  #videoWrap{position:relative;display:inline-block;max-width:100%;margin-top:8px;line-height:0;user-select:none}
  #video{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#000}
  #ocrZone{position:absolute;border:2px solid var(--buzz);background:rgba(198,241,53,.12);box-sizing:border-box;cursor:move}
  .zlabel{position:absolute;top:0;left:0;background:var(--buzz);color:#101010;font-size:10px;font-weight:800;padding:1px 6px;border-radius:7px 0 6px 0;white-space:nowrap;line-height:1.3;pointer-events:none}
  .zhandle{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;background:var(--buzz);border:2px solid #101010;border-radius:3px;cursor:nwse-resize}
  /* 독음 팝업 */
  #dkOpen{background:var(--surface);color:var(--buzz);border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
  #dkOpen:hover{border-color:var(--buzz)}
  #dkModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  #dkModal[hidden]{display:none}
  .dk-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:560px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .dk-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .dk-head b{font-size:15px}
  .dk-x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .dk-tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
  .dk-tab{font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);background:var(--surface-2);border:0;padding:6px 12px;border-radius:999px}
  .dk-tab.on{color:#101010;background:var(--buzz)}
  .dk-search{padding:11px 14px 0}
  .dk-search input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;background:var(--ink);border:1.5px solid var(--line);border-radius:10px;color:var(--text);outline:none}
  .dk-body{flex:1;overflow-y:auto;padding:12px 14px 16px}
  .dk-sec{font-size:12px;font-weight:700;color:var(--buzz);margin:14px 2px 7px}
  .dk-sec:first-child{margin-top:2px}
  .dk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .dk-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 3px 9px;text-align:center;cursor:pointer}
  .dk-card:hover{border-color:var(--buzz)}
  .dk-card .hanja{font-weight:200;color:var(--buzz);line-height:1.1;word-break:keep-all}
  .dk-card .kor{font-size:13px;font-weight:600;color:#B9BEE6;margin-top:5px}
  .dk-empty{text-align:center;color:var(--muted);font-size:14px;padding:32px 0}
  .mini{font-size:12px;color:var(--muted)}
  .seclabel{font-size:12px;color:var(--muted);font-weight:800;margin:0 0 7px 2px;display:flex;align-items:center;gap:8px}
  .seclabel .bar{flex:1;height:1px;background:var(--line)}
  #manualQ{width:100%;margin:2px 0 12px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
  #manualWrap{background:rgba(32,36,74,.35);border:1px dashed var(--line);border-radius:12px;padding:10px 10px 4px;margin-bottom:6px}
  .prevhead{width:100%;text-align:left;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px}
  #prevBody{overflow:hidden}
  #prevBody.collapsed > *{display:none}
  #prevBody.collapsed > #videoWrap{display:block;position:fixed;left:-99999px;top:0;width:420px}
  .res{position:relative}
  .res.copyable{cursor:pointer}
  .copybtn{position:absolute;right:9px;top:7px;color:var(--muted);line-height:0;display:flex}
  .res.copyable:hover .copybtn{color:var(--buzz)}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--buzz);color:#101010;font-weight:800;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90%}
  #toast.show{opacity:1}
  canvas{display:none}
  /* 팝업 모드: 게임 옆에 작게 */
  body.pop{padding:10px}
  body.pop h1{font-size:14px}
  body.pop .steps{display:none}
  body.pop #btnPopup{display:none}
  body.pop .res .q{font-size:12px}
  body.pop .ans{font-size:16px}
  body.pop .pct{font-size:18px;min-width:46px}
</style>
</head>
<body>
  <div class="top-bar">
    <h1>📷 OCR 화면검색 <span class="mini">(테스트)</span></h1>
    <select id="cat">
      <option value="">전체 게임</option>
      <option>올라올라(꼬로록)</option>
      <option>꽁꽁</option>
      <option>오엑스</option>
      <option>가로,세로</option>
    </select>
    <select id="quality" title="속도↔정확도">
      <option value="900">⚡ 빠름</option>
      <option value="1300">보통</option>
      <option value="1800">🎯 정확</option>
    </select>
    <button id="btnShare" class="primary">▶ 실시간 검색 시작</button>
    <button id="dkOpen" hidden>📖 독음</button>
    <button id="btnPopup" title="게임 옆에 작은 창으로 열기">↗ 팝업</button>
  </div>
  <div class="steps">
    PC <b>크롬</b> 권장 · 시작 → <b>[창]</b> → <b>MapleStory Worlds</b> 선택.
    아래 미리보기에서 <b>형광 박스를 파란 문제창에 맞게</b> 한 번 드래그(모서리로 크기조절)하면 기억해요.
  </div>
  <div style="margin-bottom:8px"><span id="dot" class="dot"></span><span id="status" class="status">대기 중</span></div>

  <!-- 자동 인식 결과 -->
  <div class="seclabel">🎯 자동 인식<span class="bar"></span></div>
  <div id="results"><div class="empty">실시간 검색을 시작하면 여기에 문제·정답이 떠요.</div></div>

  <!-- 직접 입력 (가운데) -->
  <input id="manualQ" autocomplete="off" placeholder="⌨️ OCR이 안 될 땐 직접 입력해서 검색 (ESC로 지움)">

  <!-- 직접 검색 결과 -->
  <div id="manualWrap" style="display:none">
    <div class="seclabel">⌨️ 직접 검색 결과<span class="bar"></span></div>
    <div id="manualResults"></div>
  </div>

  <!-- 공유화면/영역 (접어도 인식은 계속 됨) -->
  <button id="togglePrev" class="prevhead">🖥️ 공유화면 · 인식 영역 조절 <span id="togArrow">▾</span></button>
  <div id="prevBody">
    <div class="mini" style="margin-top:8px">형광 박스를 <b>문제 글자에 맞게</b> 드래그/크기조절 하세요. <b>출제자(큐플레이) 부분은 빼고</b> 잡으면 더 정확해요. (자동 저장)<br>💡 <b>문제가 안 잡히면 박스를 살짝 움직였다 놓으면</b> 다시 인식돼요.</div>
    <div id="videoWrap"><video id="video" autoplay playsinline muted></video><div id="ocrZone"><span class="zlabel">📷 문제 영역</span><div class="zhandle"></div></div></div>
    <div class="mini" id="ocrInfo" style="margin-top:6px"></div>
    <textarea id="ocrText" placeholder="OCR 원문…"></textarea>
    <button id="btnSearch" style="font-size:13px;padding:8px 12px">이 텍스트로 다시 검색</button>
    <button id="btnReset" style="font-size:13px;padding:8px 12px">영역 초기화</button>
    <div class="mini" id="loadMsg" style="margin-top:6px"></div>
  </div>

  <canvas id="cv"></canvas>
  <div id="toast"></div>
  <div id="dkModal" hidden>
    <div class="dk-box">
      <div class="dk-head"><b id="dkTitle">빠른 독음 찾기</b><button class="dk-x" id="dkClose">✕</button></div>
      <div class="dk-tabs" id="dkTabs"></div>
      <div class="dk-search"><input id="dkq" placeholder="독음이나 한자로 찾기…" autocomplete="off"></div>
      <div class="dk-body" id="dkBody"></div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ===== 족보 데이터 복호화 ===== */
const DATA_URL="qdata.txt", DATA_KEY="qplay!2026#kkong";
let DATA=[], dataReady=false;
async function decodeData(){
  const res=await fetch(DATA_URL); if(!res.ok) throw new Error(res.status);
  const b64=(await res.text()).trim(); const bin=atob(b64), key=DATA_KEY, bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i)^key.charCodeAt(i%key.length);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===',')row.push(cur),cur="";else if(c==='\n')row.push(cur),rows.push(row),row=[],cur="";else if(c!=='\r')cur+=c;}}
  if(cur!==""||row.length){row.push(cur);rows.push(row);} return rows;
}
const norm=s=>s.toLowerCase().replace(/æ/g,"ae").replace(/œ/g,"oe").replace(/[\s\p{P}\p{S}]+/gu,"");
function rowsToData(rows){
  return rows.slice(1).filter(r=>r.length>=3&&(r[1]||"").trim()&&(r[0]||"").trim()!=="올라타자")
    .map(r=>{const q=(r[1]||"").trim();return {cat:(r[0]||"기타").trim(),q,a:(r[2]||"").trim()};});
}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function hl(text,query){const t=(query||"").split(/[\s]+|[^\w가-힣]+/u).filter(w=>norm(w).length>=2);if(!t.length)return text;
  try{return text.replace(new RegExp("("+t.map(esc).join("|")+")","gi"),"<mark>$1</mark>");}catch(e){return text;}}

/* ===== 검색 ===== */
const STOP=new Set(["관한","문제","문제입니다","입니다","입니까","이다","이란"]);  // 보일러플레이트·공통꼬리 제외
function stripBlanks(s){return (s||"").replace(/[oO0○●◯□■_]{2,}/g," ");}  // 답 빈칸(OOO/OO) 제거
function ocrWords(q){const out=[];for(const p of stripBlanks(q).split(/[\s]+|[^\w가-힣]+/u)){const n=norm(p);if(n.length>=2&&!STOP.has(n))out.push(n);}return out;}
function extractQuestion(raw){
  let t=raw||"";
  t=t.replace(/[출축]\s*제\s*자\s*[:：]?\s*(큐\s*플\s*레\s*이|기\s*합)?/g," "); // '출제자 : XXX' 라벨 제거
  const cut=t.search(/\[?\s*(정\s*답|설\s*명)\s*\]?/); if(cut>=0) t=t.slice(0,cut);
  const m=t.search(/\[?\s*문\s*제\s*\]?/); if(m>=0) t=t.slice(m).replace(/\[?\s*문\s*제\s*\]?/,"");
  return t.trim();
}
const MACROS=[
  // 이미지(그림) 속 글자 입력형 — OCR 오타(이미지→미미지) 견딤
  {test:t=>(t.includes("이미지")||t.includes("미미지")||t.includes("그림"))&&(t.includes("한글")||t.includes("글자")||t.includes("입력")||t.includes("적힌")||t.includes("추방")),
   msg:"그림 속 글자를 직접 읽어서 입력하세요 (족보에 없음)"},
];
function macroHit(ocrN){ for(const m of MACROS){ if(m.test(ocrN)) return m; } return null; }

let lastKey="", haveGood=false, goodOcrN="";
function escA(s){return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
/* 정답 복사 — 꽁꽁 자동복사(포커스 있을 때) + 카드 클릭 */
function tryCopy(text,auto){
  if(!text) return;
  try{ navigator.clipboard.writeText(text)
    .then(()=>toast((auto?"자동복사: ":"복사됨: ")+text))
    .catch(()=>{ if(!auto) toast("복사하려면 이 창을 한 번 클릭 후 다시"); }); }
  catch(e){ if(!auto) toast("복사 미지원 브라우저"); }
}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1400);}
/* 꽁꽁 카드 클릭 시 정답 복사 (자동·수동 영역 모두) */
document.addEventListener("click",e=>{
  const el=e.target.closest(".res.copyable"); if(!el) return;
  const a=el.getAttribute("data-ans"); if(a) tryCopy(a,false);
});
/* 두 OCR 텍스트가 같은 문제인지(스크롤 등) 대략 판단 */
function textSim(a,b){ if(!a||!b)return 0; const g=new Set();
  for(let i=0;i+3<=b.length;i++) g.add(b.slice(i,i+3)); if(!g.size)return 0;
  let n=0; for(const x of g) if(a.includes(x)) n++; return n/g.size; }
/* 카드 HTML (꽁꽁은 복사 아이콘 + data-ans) */
function cardHTML(d,i){
  const kkong=d.cat==="꽁꽁";
  const copyIco=kkong?'<span class="copybtn" title="정답 복사"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>':'';
  return `<div class="res${i===0?' top':''}${kkong?' copyable':''}"${kkong?' data-ans="'+escA(d.a)+'" title="클릭하면 정답 복사"':''}>
    <div class="res-main"><div class="q">${d.q}</div>
      <div class="a"><span class="alabel">정답</span><span class="ans">${d.a||"-"}</span><span class="catTag">${d.cat}</span></div></div>${copyIco}</div>`;
}
/* 직접 입력 검색 → 아래 '직접 검색 결과' 영역 (자동 인식과 독립) */
function manualSearch(){
  const q=document.getElementById("manualQ").value.trim();
  const wrap=document.getElementById("manualWrap"), box=document.getElementById("manualResults");
  if(!q){ wrap.style.display="none"; box.innerHTML=""; return; }
  wrap.style.display="";
  if(!dataReady){ box.innerHTML='<div class="mini">데이터 불러오는 중…</div>'; return; }
  const cat=document.getElementById("cat").value;
  const qn=norm(q), toks=q.split(/\s+/).map(norm).filter(Boolean);
  const best=[];
  for(const d of DATA){
    if(cat&&d.cat!==cat) continue;
    const qt=d._qn||(d._qn=norm(d.q));
    let s=0;
    const idx=qt.indexOf(qn);
    if(idx>=0) s=100-Math.min(50,idx);
    else { let all=true,mn=1e9; for(const t of toks){const p=qt.indexOf(t);if(p<0){all=false;break;}if(p<mn)mn=p;} if(all&&toks.length) s=50-Math.min(30,(mn/5)|0); }
    if(s>0) best.push({...d,s});
  }
  best.sort((a,b)=>b.s-a.s);
  const top=best.slice(0,6);
  box.innerHTML = top.length ? top.map((d,i)=>cardHTML(d,i)).join("") : '<div class="empty">일치하는 문제 없음</div>';
}
(function(){const el=document.getElementById("manualQ");let t=null;
  el.value="";   // 새로고침 시 브라우저 복원 방지
  el.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(manualSearch,180);});
  el.addEventListener("keydown",e=>{ if(e.key==="Escape"){ el.value=""; clearTimeout(t); manualSearch(); el.blur(); } });})();
/* 공유화면 접기/펼치기 — 접어도 비디오는 렌더링 유지(OCR 계속 됨) */
document.getElementById("togglePrev").onclick=()=>{
  const b=document.getElementById("prevBody"); b.classList.toggle("collapsed");
  document.getElementById("togArrow").textContent=b.classList.contains("collapsed")?"▸":"▾";
};

function ocrSearch(raw){
  const box=document.getElementById("results");
  if(!dataReady) return;
  const ocrN=norm(raw);
  if(ocrN.length<4) return;
  const mh=macroHit(ocrN);
  if(mh){ if(lastKey!=="macro"){ lastKey="macro";
      box.innerHTML=`<div class="macro"><div class="macro-title">⭐⭐⭐ 매크로 문제입니다! ⭐⭐⭐</div><div class="macro-sub">${mh.msg} · 족보에 정답이 없어요</div></div>`;
    } return; }
  const cat=document.getElementById("cat").value;
  const best=[];
  for(const d of DATA){
    if(cat&&d.cat!==cat) continue;
    const w=d._w||(d._w=ocrWords(d.q)); if(w.length<2) continue;
    let matched=0,cov=0,total=0;
    for(const x of w){ total+=x.length; if(ocrN.includes(x)){matched++;cov+=x.length;} }
    if(matched<2||total===0) continue;
    const pct=cov/total; if(pct<0.4) continue;
    // 맞은 단어 '개수'를 반영: 흔한 단어 2개 우연히 겹친 짧은 문제가 긴 정답을 못 이기게
    const conf=pct*(0.55+0.45*Math.min(1,matched/5));
    best.push({...d,pct:conf,matched});
  }
  best.sort((a,b)=>b.pct-a.pct||b.matched-a.matched);
  const top=best.slice(0,4);
  // '확신' 매칭일 때만 갱신. 약하면: 같은 문제(스크롤)는 답 유지, 완전 새 문제면 옛 답 치움
  const strong = top.length>0 && top[0].pct>=0.5 && top[0].matched>=3;
  if(!strong){
    if(haveGood){
      if(textSim(ocrN,goodOcrN)>=0.35) return;   // 같은 문제 → 답 유지(긴 문제 스크롤 대응)
      haveGood=false;                            // 새 문제인데 못 읽음 → 붙박이 해제
    }
    if(!top.length){ if(lastKey!=="unread"){box.innerHTML='<div class="empty">🔍 문제를 못 읽었어요 — <b>위 ⌨️ 입력칸에 문제를 직접 쳐서</b> 검색하세요.<br><span class="mini">(또는 "정확" 모드 / 영역을 살짝 옮겨보기)</span></div>';lastKey="unread";} return; }
    // 약한 후보라도 표시(확신 아님 → 기억 안 함)
  }
  const key=top.map(d=>d.q).join("|");
  if(key===lastKey) return;
  lastKey=key;
  if(strong){ haveGood=true; goodOcrN=ocrN; }
  const showCat=!cat;
  box.innerHTML=top.map((d,i)=>{
    const p=Math.round(d.pct*100), cls=p>=80?"hi":p>=55?"mid":"lo";
    const kkong=d.cat==="꽁꽁";
    const copyIco=kkong?'<span class="copybtn" title="정답 복사"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>':'';
    return `<div class="res${i===0?' top':''}${kkong?' copyable':''}"${kkong?' data-ans="'+escA(d.a)+'" title="클릭하면 정답 복사"':''}>
      <div class="res-main"><div class="q">${hl(d.q,raw)}</div>
        <div class="a"><span class="alabel">정답</span><span class="ans">${d.a||"-"}</span>${showCat?`<span class="catTag">${d.cat}</span>`:""}</div></div>
      <div class="pct ${cls}">${p}%<small>유사도</small></div>${copyIco}</div>`;}).join("");
  if(strong && top[0].cat==="꽁꽁") tryCopy(top[0].a,true);   // 꽁꽁 자동복사(포커스 있을 때)
}
document.getElementById("btnSearch").onclick=()=>{lastKey="";ocrSearch(extractQuestion(document.getElementById("ocrText").value));};

/* ===== 인식 영역(드래그·크기조절·저장) ===== */
const DEF_REGION={x:0.03,y:0.02,w:0.94,h:0.26};  // 가로 거의 전체 + 위쪽 띠 (질문이 안 잘림, 맵 바뀌어도 OK)
let region=loadRegion();
function loadRegion(){try{const r=JSON.parse(localStorage.getItem("ocrRegion_v2"));if(r&&r.w>0.02&&r.h>0.02)return r;}catch(e){}return {...DEF_REGION};}
function saveRegion(){try{localStorage.setItem("ocrRegion_v2",JSON.stringify(region));}catch(e){}}
function applyZone(){const z=document.getElementById("ocrZone");
  z.style.left=(region.x*100).toFixed(2)+"%";z.style.top=(region.y*100).toFixed(2)+"%";
  z.style.width=(region.w*100).toFixed(2)+"%";z.style.height=(region.h*100).toFixed(2)+"%";}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
(function initZoneDrag(){
  const zone=document.getElementById("ocrZone"), wrap=document.getElementById("videoWrap");
  let mode=null,sx,sy,sr;
  zone.addEventListener("mousedown",e=>{
    mode=e.target.classList.contains("zhandle")?"resize":"move";
    sx=e.clientX;sy=e.clientY;sr={...region};e.preventDefault();});
  window.addEventListener("mousemove",e=>{
    if(!mode)return; const r=wrap.getBoundingClientRect(); if(!r.width)return;
    const dx=(e.clientX-sx)/r.width, dy=(e.clientY-sy)/r.height;
    if(mode==="move"){ region.x=clamp(sr.x+dx,0,1-sr.w); region.y=clamp(sr.y+dy,0,1-sr.h); }
    else { region.w=clamp(sr.w+dx,0.05,1-sr.x); region.h=clamp(sr.h+dy,0.03,1-sr.y); }
    applyZone();});
  window.addEventListener("mouseup",()=>{ if(mode){mode=null;saveRegion();} });
  applyZone();
})();
document.getElementById("btnReset").onclick=()=>{region={...DEF_REGION};applyZone();saveRegion();};

/* ===== 화면 공유 + 실시간 루프 ===== */
let stream=null, running=false, worker=null, workerReady=false;
const video=document.getElementById("video"), btnShare=document.getElementById("btnShare");
async function ensureWorker(){
  if(workerReady)return;
  setStatus("OCR 엔진 로딩 중… (처음 한 번, 10여 MB)");
  worker=await Tesseract.createWorker(["kor","eng"]);
  // 레이아웃 자동 분석(기본 PSM 3): '출제자' 라벨과 질문 줄을 섞지 않고 각 줄로 인식 → 정확도↑
  try{ await worker.setParameters({ tessedit_pageseg_mode:"3" }); }catch(e){}
  workerReady=true;
}
btnShare.onclick=async()=>{
  if(running){ stopAll(); return; }
  try{
    stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:5},audio:false});
    video.srcObject=stream;
    stream.getVideoTracks()[0].onended=()=>stopAll();
    if(!document.body.classList.contains("pop")) document.getElementById("prevBody").classList.remove("collapsed");
    await ensureWorker();
    running=true; haveGood=false; lastKey=""; lastSig=null; goodOcrN="";
    btnShare.textContent="■ 중지"; btnShare.className="stop";
    setDot(true); setStatus("실시간 인식 중…");
    loop();
  }catch(e){ setStatus("화면공유 취소/실패: "+e.message); }
};
function stopAll(){
  running=false; setDot(false); setStatus("중지됨");
  btnShare.textContent="▶ 실시간 검색 시작"; btnShare.className="primary";
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}
let TARGET_W=+(localStorage.getItem("ocrQuality")||1300);  // 속도/정확도 (버튼으로 조절, 저장)
(function initQuality(){const q=document.getElementById("quality");q.value=String(TARGET_W);
  q.onchange=()=>{TARGET_W=+q.value;try{localStorage.setItem("ocrQuality",q.value);}catch(e){}};})();
const DIFF_PX=24, DIFF_MIN=4;        // 샘플점이 24이상 바뀐 게 4개↑면 '화면 변함' → 글자 변화에 민감
let lastSig=null;
function makeSig(d,w,h){const cols=28,rows=10,s=new Array(cols*rows);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=((c+0.5)/cols*w)|0,y=((r+0.5)/rows*h)|0;s[r*cols+c]=d[(y*w+x)*4];}return s;}
function sigChanged(a,b){if(!a||!b)return true;let n=0;for(let i=0;i<a.length;i++)if(Math.abs(a[i]-b[i])>DIFF_PX)n++;return n>=DIFF_MIN;}
async function loop(){
  while(running){
    if(video.videoWidth){
      try{
        const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
        const vw=video.videoWidth, vh=video.videoHeight;
        const sx=Math.round(region.x*vw), sy=Math.round(region.y*vh);
        const cw=Math.max(1,Math.round(region.w*vw)), ch=Math.max(1,Math.round(region.h*vh));
        let sc=TARGET_W/cw; sc=sc<0.5?0.5:sc>2.5?2.5:sc;   // 작은 영역은 확대(최대 2.5배), 너무 크면 축소
        cv.width=Math.round(cw*sc); cv.height=Math.round(ch*sc);
        ctx.drawImage(video, sx,sy, cw,ch, 0,0, cv.width,cv.height);
        const img=ctx.getImageData(0,0,cv.width,cv.height),d=img.data;
        // 1) 그레이스케일
        for(let i=0;i<d.length;i+=4){d[i]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];}
        // 2) 반전 판단은 '가운데(문제 박스)' 밝기로 — 주변 어두운 게임 배경에 안 속게
        let sum=0,cnt=0; const W=cv.width,H=cv.height;
        for(let y=(H*0.15)|0;y<(H*0.85)|0;y++)for(let x=(W*0.30)|0;x<(W*0.70)|0;x++){sum+=d[(y*W+x)*4];cnt++;}
        const inv=cnt>0 && (sum/cnt)<110;   // 박스 배경이 어두우면 반전
        // 3) 대비 강화: 회색 글자를 진하게, 배경을 밝게
        for(let i=0;i<d.length;i+=4){let v=inv?255-d[i]:d[i];v=(v-160)*2.2+128;v=v<0?0:v>255?255:v;d[i]=d[i+1]=d[i+2]=v;}
        const sig=makeSig(d,cv.width,cv.height);
        if(!sigChanged(sig,lastSig)){ await new Promise(r=>setTimeout(r,120)); continue; }
        lastSig=sig;
        ctx.putImageData(img,0,0);
        const t0=performance.now();
        const {data}=await worker.recognize(cv);
        const ms=Math.round(performance.now()-t0);
        const text=(data.text||"").replace(/\s+/g," ").trim();
        const qtext=extractQuestion(text);
        document.getElementById("ocrText").value=text;
        document.getElementById("ocrInfo").textContent=`OCR 신뢰도 ${Math.round(data.confidence)}% · ${ms}ms · 문제: ${qtext.slice(0,38)}`;
        ocrSearch(qtext);
      }catch(e){}
    }
    await new Promise(r=>setTimeout(r,100));
  }
}
function setStatus(s){document.getElementById("status").textContent=s;}
function setDot(on){document.getElementById("dot").className="dot"+(on?" on":"");}

/* ===== 독음 팝업 (꽁꽁 전용) ===== */
let dkGame="꽁꽁", dkType="전체", DOKEUM=null;
async function dkEnsure(){
  if(DOKEUM) return;
  const res=await fetch("d7k2m9x.txt"); if(!res.ok) throw new Error(res.status);
  const bin=atob((await res.text()).trim()), key=DATA_KEY, bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i)^key.charCodeAt(i%key.length);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  DOKEUM=JSON.parse(new TextDecoder().decode(await new Response(stream).arrayBuffer()));
}
function dkList(){ return (DOKEUM||[]).filter(d=>d.g===dkGame).map(d=>({hanja:d.h,kor:d.k,type:d.t})); }
function choseong(kr){const map={"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};const c=(kr||"").charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3){const cho=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"][Math.floor((c-0xAC00)/588)];return map[cho]||cho;}return "#";}
function dkRender(){
  let items=dkList();
  if(dkType!=="전체") items=items.filter(x=>x.type===dkType);
  const kw=norm(document.getElementById("dkq").value);
  if(kw) items=items.filter(x=>norm(x.hanja).includes(kw)||norm(x.kor).includes(kw));
  const seen=new Set(); items=items.filter(x=>{const k=x.hanja+"|"+x.kor;if(seen.has(k))return false;seen.add(k);return true;});
  const fontFor=L=>L<=2?29:L===3?23:L===4?18:L===5?15:13;
  const isAll=dkType==="전체";
  const card=x=>`<div class="dk-card" data-copy="${escA(x.kor)}"><div class="hanja" style="font-size:${fontFor(x.kor.length)}px">${x.hanja}</div><div class="kor">${x.kor}</div></div>`;
  const groups={},order=[];
  if(isAll){ items.sort((a,b)=>a.kor.localeCompare(b.kor,"ko")); items.forEach(x=>{const c=choseong(x.kor);if(!groups[c]){groups[c]=[];order.push(c);}groups[c].push(x);}); }
  else { items.sort((a,b)=>a.kor.length-b.kor.length||a.kor.localeCompare(b.kor,"ko")); items.forEach(x=>{const L=x.kor.length;if(!groups[L]){groups[L]=[];order.push(L);}groups[L].push(x);}); }
  const body=document.getElementById("dkBody");
  if(!items.length){ body.innerHTML='<div class="dk-empty">해당하는 독음이 없어요.</div>'; return; }
  const hint='<div style="text-align:right;font-size:11px;color:var(--muted);margin:0 2px 8px">카드를 눌러 정답 복사</div>';
  body.innerHTML=hint+order.map(sec=>`<div class="dk-sec">${isAll?sec:sec+"글자"}</div><div class="dk-grid">${groups[sec].map(card).join("")}</div>`).join("");
}
function dkBuildTabs(){
  const items=dkList(); const counts={}; items.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);
  const list=["전체",...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];
  document.getElementById("dkTabs").innerHTML=list.map(t=>{const n=t==="전체"?items.length:counts[t];return `<button class="dk-tab ${t===dkType?'on':''}" data-t="${t}">${t} · ${n}</button>`;}).join("");
}
async function openDk(){
  document.getElementById("dkModal").hidden=false;
  document.getElementById("dkTitle").textContent="꽁꽁 빠른 독음 찾기";
  document.getElementById("dkq").value=""; dkType="전체";
  if(!DOKEUM){ document.getElementById("dkBody").innerHTML='<div class="dk-empty">불러오는 중…</div>';
    try{ await dkEnsure(); }catch(e){ document.getElementById("dkBody").innerHTML='<div class="dk-empty">독음을 불러오지 못했어요.</div>'; return; } }
  dkBuildTabs(); dkRender();
}
document.getElementById("dkOpen").onclick=openDk;
document.getElementById("dkClose").onclick=()=>document.getElementById("dkModal").hidden=true;
document.getElementById("dkModal").addEventListener("click",e=>{ if(e.target.id==="dkModal") document.getElementById("dkModal").hidden=true; });
document.getElementById("dkq").addEventListener("input",dkRender);
document.getElementById("dkTabs").addEventListener("click",e=>{const b=e.target.closest(".dk-tab");if(!b)return;dkType=b.dataset.t;dkBuildTabs();dkRender();});
document.getElementById("dkBody").addEventListener("click",e=>{const c=e.target.closest(".dk-card");if(!c)return;tryCopy(c.dataset.copy||"",false);});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("dkModal").hidden) document.getElementById("dkModal").hidden=true; });
/* 게임 선택이 '꽁꽁'일 때만 독음 버튼 */

  function upd(){ document.getElementById("dkOpen").hidden = sel.value!=="꽁꽁"; }
  sel.addEventListener("change",upd); upd();})();

    document.getElementById("loadMsg").textContent="족보 데이터 로드 완료: "+DATA.length.toLocaleString()+"문제";

    setStatus("데이터 로드 실패 — 저장소에 올려서 열어주세요"); }
})();
