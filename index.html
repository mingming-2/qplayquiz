<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>큐플레이 아카이브 웹족보</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#0E1020; --surface:#181B34; --surface-2:#20244a; --line:#2c3160;
    --text:#EDEEF7; --muted:#8A90BC; --buzz:#C6F135; --hot:#FF4D97; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, #1b2050 0%, transparent 60%),
      radial-gradient(700px 500px at 110% 10%, #2a1440 0%, transparent 55%),
      var(--ink);
    color:var(--text);min-height:100vh;padding:20px 16px 60px;line-height:1.5;
  }
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin:8px 2px 18px}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--buzz);
    box-shadow:0 0 0 4px rgba(198,241,53,.18),0 0 22px rgba(198,241,53,.55);
    animation:pulse 2.4s ease-in-out infinite;flex:0 0 auto}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(198,241,53,.08),0 0 26px rgba(198,241,53,.7)}}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em;flex:1}
  h1 span{color:var(--muted);font-weight:600;font-size:13px;display:block;letter-spacing:0}
  /* 상단 우측 제보 버튼 */
  #fab{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--surface);color:var(--buzz);cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:border-color .15s, transform .1s}
  #fab:hover{border-color:var(--buzz)}
  #fab:active{transform:scale(.94)}
  #fab svg{width:20px;height:20px}
  .notice{display:flex;align-items:center;gap:9px;background:rgba(198,241,53,.10);
    border:1px solid rgba(198,241,53,.35);border-radius:12px;padding:11px 13px;
    margin-bottom:14px;font-size:13.5px;line-height:1.5;color:var(--text)}
  .notice svg{width:18px;height:18px;flex:0 0 auto;color:var(--buzz)}
  .notice b{color:var(--buzz);font-weight:800}

  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:16px 46px 16px 18px;font-size:16px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:var(--radius);color:var(--text);outline:none;
    transition:border-color .15s, box-shadow .15s}
  .search input:focus{border-color:var(--buzz);box-shadow:0 0 0 4px rgba(198,241,53,.14)}
  .search input::placeholder{color:var(--muted)}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);
    color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .clear:hover{color:var(--text)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  select{flex:1;min-width:120px;padding:10px 12px;font-size:14px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:10px;color:var(--text);outline:none;font-family:inherit}
  select:focus{border-color:var(--buzz)}
  .meta{font-size:13px;color:var(--muted);margin:14px 2px 10px}
  .meta b{color:var(--buzz)}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;animation:rise .25s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink);
    background:var(--buzz);padding:3px 9px;border-radius:999px;margin-bottom:9px}
  .q{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px}
  .a{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:800;color:var(--buzz);
    border-top:1px dashed var(--line);padding-top:10px;cursor:pointer}
  .a .cp{align-self:center;margin-left:auto;width:15px;height:15px;color:var(--muted);flex:0 0 auto}
  .a:hover .cp{color:var(--buzz)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--buzz);color:var(--ink);font-weight:800;font-size:14px;padding:10px 18px;
    border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .a::before{content:"정답";font-size:11px;font-weight:700;color:var(--hot);letter-spacing:.04em;
    flex:0 0 auto;transform:translateY(-1px)}
  mark{background:rgba(255,77,151,.25);color:var(--text);border-radius:3px;padding:0 2px}
  .by{margin-top:8px;text-align:right;font-size:11px;color:var(--muted)}
  .by b{color:var(--muted);font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
  .banner{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.7}
  .banner b{color:var(--buzz)}
  .banner code{background:var(--ink);padding:2px 6px;border-radius:6px;color:var(--text);font-size:12px;word-break:break-all}
  footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
    border-top-color:var(--buzz);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── 제보 팝업 ── */
  .modal-bg{position:fixed;inset:0;background:rgba(6,8,20,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
  .modal-bg[hidden]{display:none}
  .modal{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;animation:pop .18s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:6px 6px 6px 6px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;
    font-weight:700;padding:12px 14px;cursor:pointer;border-radius:10px}
  .tab.active{color:var(--ink);background:var(--buzz)}
  .mclose{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;
    width:38px;height:38px;border-radius:10px}
  .mclose:hover{color:var(--text)}
  .modal-body{padding:16px}
  .pane[hidden]{display:none}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea{width:100%;padding:11px 12px;font-size:15px;font-family:inherit;
    background:var(--ink);border:1.5px solid var(--line);border-radius:10px;color:var(--text);outline:none}
  .field select{width:100%;padding:11px 12px;font-size:15px;font-family:inherit;
    background:var(--ink);border:1.5px solid var(--line);border-radius:10px;color:var(--text);outline:none}
  .field select:focus{border-color:var(--buzz)}
  .field input:focus,.field textarea:focus{border-color:var(--buzz)}
  .field textarea{resize:vertical;min-height:72px}
  .send{width:100%;padding:14px;font-size:15px;font-weight:800;font-family:inherit;
    background:var(--buzz);color:var(--ink);border:0;border-radius:12px;cursor:pointer;margin-top:4px}
  .send:hover{filter:brightness(1.05)}
  .send:disabled{opacity:.5;cursor:default}
  .msg{margin-top:12px;font-size:13px;text-align:center;min-height:18px}
  .msg.ok{color:var(--buzz)}
  .msg.err{color:var(--hot)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot"></div>
    <h1>큐플레이 아카이브 웹족보<span>문제를 입력하면 정답을 찾아드려요</span></h1>
    <button id="fab" aria-label="제보하기" title="제보 / 버그 신고">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </button>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
    <span>지금은 여러분의 힘이 필요할 때예요!<br><b>적극적으로 문제를 제보해 주세요!</b></span>
  </div>

  <div id="banner"></div>

  <div class="search">
    <input id="q" type="text" placeholder="문제 일부만 입력해도 돼요…" autocomplete="off">
    <button class="clear" id="clear" title="지우기">✕</button>
  </div>

  <div class="controls">
    <select id="cat"><option value="">게임 선택</option></select>
    <select id="limit">
      <option value="10">10건</option>
      <option value="30" selected>30건</option>
      <option value="50">50건</option>
      <option value="9999">전체</option>
    </select>
    <select id="sort">
      <option value="rel">관련순</option>
      <option value="asc">가나다↑</option>
      <option value="desc">가나다↓</option>
    </select>
  </div>

  <div class="meta" id="meta"></div>
  <div class="list" id="list"></div>

  <footer></footer>
</div>

<div class="toast" id="toast"></div>

<!-- 제보 / 버그 신고 팝업 -->
<div class="modal-bg" id="modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <div class="tabs">
        <button class="tab active" data-tab="q">문제 제보</button>
        <button class="tab" data-tab="b">버그 신고</button>
      </div>
      <button class="mclose" id="mclose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="pane" id="pane-q">
        <div class="field"><label>게임</label><select id="f-game">
          <option value="" disabled selected>게임을 선택하세요</option>
          <option value="올라올라(꼬로록)">올라올라(꼬로록)</option>
          <option value="꽁꽁">꽁꽁</option>
          <option value="OX,XO">OX,XO</option>
          <option value="가로세로">가로세로</option>
        </select></div>
        <div class="field"><label>문제</label><textarea id="f-question" placeholder="예: 세계에서 가장 높은 산은?"></textarea></div>
        <div class="field"><label>정답</label><input id="f-answer" type="text" placeholder="예: 에베레스트"></div>
        <div class="field"><label>제보자 (닉네임)</label><input id="f-by" type="text" placeholder="사이트에 표시될 닉네임 (선택)"></div>
        <button class="send" id="send-q">제보 보내기</button>
      </div>
      <div class="pane" id="pane-b" hidden>
        <div class="field"><label>증상</label><textarea id="f-symptom" placeholder="어떤 문제가 있었는지 적어주세요"></textarea></div>
        <button class="send" id="send-b">신고 보내기</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   ① 문제 데이터를 읽어올 구글시트 CSV 주소 (이미 넣어뒀어요)
   ══════════════════════════════════════════════════════════ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8Eh0qizgj9xTEyFtEPWvhIlioj-Vd4MYtpCVSiAALBu-KaG2NVj68qWFhbOJ4SO6vXch4pSlRSGq8/pub?output=csv";

/* ══════════════════════════════════════════════════════════
   ② 제보/신고를 시트에 저장할 "앱스 스크립트 웹앱 주소"를 넣으세요.
      (설정 방법은 안내를 참고하세요. 비워두면 제출이 안 돼요)
      예: "https://script.google.com/macros/s/XXXX/exec"
   ══════════════════════════════════════════════════════════ */
const SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyuaLVZjwwzJX9o1jVkeicriEGCgOOCslr3YAownXYL6KcqlfuFxWChTcXbDA5I2_4s/exec";

const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().replace(/\s+/g,"");
const esc  = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const escAttr = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let DATA = [];

/* ── CSV 파서 ── */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else{
      if(c==='"') q=true;
      else if(c===',') { row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function rowsToData(rows){
  return rows.slice(1)
    .filter(r=>r.length>=3 && (r[1]||"").trim())
    .map(r=>({ cat:(r[0]||"기타").trim(), q:(r[1]||"").trim(), a:(r[2]||"").trim(), by:(r[3]||"").trim() }));
}

/* ── 검색 ── */
function score(query,item){
  const qt=norm(item.q);
  const tokens=query.trim().split(/\s+/).map(norm).filter(Boolean);
  if(!tokens.length) return 0;
  let first=Infinity;
  for(const t of tokens){
    const idx=qt.indexOf(t);
    if(idx===-1) return 0;
    if(idx<first) first=idx;
  }
  return Math.max(1, 100-first);
}
function highlight(text,query){
  const tokens=query.trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return text;
  try{ return text.replace(new RegExp("("+tokens.map(esc).join("|")+")","gi"),"<mark>$1</mark>"); }
  catch(e){ return text; }
}
function buildCats(){
  $("#cat").innerHTML='<option value="">게임 선택</option>';
  [...new Set(DATA.map(d=>d.cat))].forEach(c=>{
    const o=document.createElement("option");o.value=c;o.textContent=c;$("#cat").appendChild(o);
  });
}
function render(){
  const query=$("#q").value.trim(), cat=$("#cat").value,
        limit=+$("#limit").value, sort=$("#sort").value;
  if(!query){
    $("#meta").innerHTML="";
    $("#list").innerHTML=`<div class="empty"><b>문제를 검색해보세요</b>위 칸에 문제 일부만 입력하면 정답이 나와요.</div>`;
    return;
  }
  if(!loaded){
    $("#meta").innerHTML="";
    $("#list").innerHTML=`<div class="empty"><b><span class="spin"></span> 문제를 불러오는 중…</b>잠시만 기다려주세요.</div>`;
    return;
  }
  let rows=DATA.filter(d=>!cat||d.cat===cat);
  rows = rows.map(d=>({...d,s:score(query,d)})).filter(d=>d.s>0);
  if(sort==="rel")       rows.sort((a,b)=>b.s-a.s);
  else if(sort==="desc") rows.sort((a,b)=>b.q.localeCompare(a.q,"ko"));
  else                   rows.sort((a,b)=>a.q.localeCompare(b.q,"ko"));
  const total=rows.length; rows=rows.slice(0,limit);
  $("#meta").innerHTML=`“${query}” 검색결과 <b>${total}</b>건`;
  if(!rows.length){
    $("#list").innerHTML=`<div class="empty"><b>결과가 없어요</b>다른 단어로 다시 검색해보세요.</div>`;return;
  }
  $("#list").innerHTML=rows.map(d=>`
    <div class="card"><span class="cat">${d.cat}</span>
      <div class="q">${highlight(d.q,query)}</div>
      <div class="a" data-copy="${escAttr(d.a)}">${highlight(d.a,query)}<svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
      ${d.by?`<div class="by">제보: <b>${d.by}</b></div>`:""}</div>`).join("");
}

/* ── 데이터 로드 (필요할 때 한 번만) ── */
let loaded=false, loading=false;
async function ensureLoaded(){
  if(loaded || loading || !SHEET_CSV_URL) return;
  loading=true;
  const banner=$("#banner");
  try{
    const res=await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error(res.status);
    DATA=rowsToData(parseCSV(await res.text()));
    loaded=true;
    banner.className=""; banner.innerHTML="";
    buildCats(); render();
  }catch(e){
    banner.className="banner";
    banner.innerHTML=`<b>시트를 불러오지 못했어요.</b><br>웹에 게시(CSV) 상태와 주소를 확인해주세요. (오류: ${e.message})`;
  }finally{ loading=false; }
}

/* ── 팝업 동작 ── */
const modal=$("#modal"), msg=$("#msg");
function openModal(){ modal.hidden=false; }
function closeModal(){ modal.hidden=true; msg.textContent=""; msg.className="msg"; }
$("#fab").addEventListener("click",openModal);
$("#mclose").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  const tab=t.dataset.tab;
  $("#pane-q").hidden = tab!=="q";
  $("#pane-b").hidden = tab!=="b";
  msg.textContent=""; msg.className="msg";
}));

async function submit(type, payload, btn){
  if(!SUBMIT_ENDPOINT){
    msg.textContent="아직 제보 저장 기능이 연결되지 않았어요.";
    msg.className="msg err"; return;
  }
  btn.disabled=true; msg.textContent="보내는 중…"; msg.className="msg";
  try{
    await fetch(SUBMIT_ENDPOINT, { method:"POST", mode:"no-cors",
      body:new URLSearchParams({type, ...payload}) });
    msg.textContent="제출됐어요. 감사합니다!";
    msg.className="msg ok";
    setTimeout(closeModal, 1200);
    // 입력칸 비우기
    ["f-game","f-question","f-answer","f-by","f-symptom"].forEach(id=>{ if($("#"+id)) $("#"+id).value=""; });
  }catch(e){
    msg.textContent="전송에 실패했어요. 잠시 후 다시 시도해주세요.";
    msg.className="msg err";
  }finally{ btn.disabled=false; }
}

$("#send-q").addEventListener("click",e=>{
  const game=$("#f-game").value.trim(), question=$("#f-question").value.trim(),
        answer=$("#f-answer").value.trim(), by=$("#f-by").value.trim();
  if(!game){ msg.textContent="게임을 선택해주세요."; msg.className="msg err"; return; }
  if(!question || !answer){ msg.textContent="문제와 정답은 꼭 적어주세요."; msg.className="msg err"; return; }
  submit("question", {game, question, answer, by}, e.currentTarget);
});
$("#send-b").addEventListener("click",e=>{
  const symptom=$("#f-symptom").value.trim();
  if(!symptom){ msg.textContent="증상을 적어주세요."; msg.className="msg err"; return; }
  submit("bug", {symptom}, e.currentTarget);
});

const toast=$("#toast"); let toastT;
function showToast(t){ toast.textContent=t; toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),1300); }
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{ try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); res(); }catch(e){ rej(e); } });
}
$("#list").addEventListener("click",e=>{
  const el=e.target.closest(".a"); if(!el) return;
  copyText(el.dataset.copy||"").then(()=>showToast("정답이 복사됐어요!")).catch(()=>showToast("복사에 실패했어요"));
});

$("#q").addEventListener("focus",ensureLoaded);
$("#q").addEventListener("input",()=>{ ensureLoaded(); render(); });
$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const first=$("#list .a");
    if(first) copyText(first.dataset.copy||"").then(()=>showToast("맨 위 정답을 복사했어요!")).catch(()=>{});
  }
});
$("#cat").addEventListener("mousedown",ensureLoaded);
$("#cat").addEventListener("change",render);
$("#limit").addEventListener("change",render);
$("#sort").addEventListener("change",render);
$("#clear").addEventListener("click",()=>{ $("#q").value=""; $("#q").focus(); render(); });
render();
</script>
</body>
</html>
